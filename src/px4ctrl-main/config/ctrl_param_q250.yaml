#########################################################################
# ⭐⭐⭐  Set parameters carefully for satisfied performance!   ⭐⭐⭐ #
#########################################################################

mass        : 2.00 #1.642 # kg 1.188是小电池  1.836 vtol  #1.642  #加雷达vtol  2110 
gra         : 9.8 
pose_solver : 3    # 0:From ZhepeiWang (drag & less singular) 1:From ZhepeiWang, 2:From rotor-drag  3: From hkust n1-ctrl
ctrl_freq_max   : 100.0
ctrl_rate   : 50.0
use_bodyrate_ctrl: false #原本是false   不要改不要改
use_normal_or_acc_closeloop: false #    不要改不要改    true normal
forbid_cmdctrl_reentry_after_loss: true  # 实机建议true: CMD_CTRL丢失一次后禁止自动重入
# 四通道原始 PWM（与 input 一致：中位 1500、±500）任一 |归一化| > percent/100 则本节点不再发 publish_attitude_ctrl / publish_acc_closeloop_ctrl，并锁存、请求 ALTCTL（与 COM_OF_LOSS_T 等配合；断流间隙推力行为以固件为准，一般非“真空”）
rc_stick_abort_offboard_enable: true
rc_stick_abort_offboard_percent: 10.0   # 例如 5 表示 5%，即 0.05
max_manual_vel: 0.5
max_angle: 30  # Attitude angle limit in degree. A negative value means no limit.
low_voltage: 13.2 # 4S battery

rc_reverse: # *
    roll: false
    pitch: false
    yaw: false
    throttle: false

rc_mode:
    # SET TRUE WHEN USING CODE CODE CMD !!!
    world_frame_ctrl:  false # false # True: rc control xyz in odom frame; False: rc control xyz in body frame; 
 # false # True: rc control xyz in odom frame; False: rc control xyz in body frame; 
    #之前是false
auto_takeoff_land:
    enable: true # raw true
    enable_auto_arm: true # raw true
    no_RC: false
    takeoff_height: 1.5 #23.5 #23.5 # m  10
    takeoff_land_speed: 0.36 # m/s

thrust_model: # The model that maps thrust signal u(0~1) to real thrust force F(Unit:N): F=K1*Voltage^K2*(K3*u^2+(1-K3)*u). 
    print_value: false # display the value of “thr_scale_compensate” or “hover_percentage” during thrust model estimating.
    accurate_thrust_model: false  # This can always enabled if don't require accurate control performance :-)
    noisy_imu: false # Strongly not recommended! Unless you really have no any ways to reduce drone vibration.
    # accurate thrust mapping parameters
    K1: 0.7583 # Needs precise calibration!
    K2: 1.6942 # Needs precise calibration!
    K3: 0.6786 # Needs precise calibration! K3 equals THR_MDL_FAC in https://docs.px4.io/master/en/config_mc/pid_tuning_guide_multicopter.html.
    # approximate thrust mapping parameters
    hover_percentage: 0.39  # Thrust percentage in Stabilize/Arco mode # *  #0.25

gain: 
    # Cascade PID controller. Recommend to read the code.
    Kp0: 1.5 # 3.0
    Kp1: 1.5  # 3.0
    Kp2: 1.5 # 3.0
    Kv0: 1.0 #2.0
    Kv1: 1.0 #2
    Kv2: 1.0 #2
    # ↓↓↓ No use now --
    Kvi0: 0.0
    Kvi1: 0.0
    Kvi2: 0.0
    Kvd0: 0.0
    Kvd1: 0.0
    Kvd2: 0.0
    # ↓↓↓ Only used in rate control mode.
    KAngR: 20.0
    KAngP: 20.0
    KAngY: 20.0


gain_hkust:
    # hkust PID controller 
    Kpp0: 1.0 # 3.0
    Kpp1: 1.0 # 3.0
    Kpp2: 1.0 # 3.0
    
    Kpi0: 0.0 # 
    Kpi1: 0.0 # 
    Kpi2: 0.0 # 
    
    Kpd0: 0.0 # 
    Kpd1: 0.0 # 
    Kpd2: 0.0 # 
    # No use now 
    Kvp0: 2.0 # 
    Kvp1: 2.0 # 
    Kvp2: 2.0 # 
    
    Kvi0: 0.0 # 
    Kvi1: 0.0 # 
    Kvi2: 0.0 # 
    
    Kvd0: 0.0 # 
    Kvd1: 0.0 # 
    Kvd2: 0.0 # 
    
    Kv0 : 0.0 # 
    Kv1 : 0.0 #  
    Kv2 : 0.0 #  

    Ka0 : 0.0 #
    Ka1 : 0.0 #
    Ka2 : 0.0 #


rotor_drag:  
    x: 0.0  # The reduced acceleration on each axis caused by rotor drag. Unit:(m*s^-2)/(m*s^-1).
    y: 0.0  # Same as above
    z: 0.0  # Same as above
    k_thrust_horz: 0.0 # Set to 0 recommended... --

msg_timeout:
    odom: 0.5
    rc:   0.5
    cmd:  0.2
    imu:  0.5
    bat:  0.5
